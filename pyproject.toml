[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puxirum"
version = "0.1.0.dev0"
description = "A deterministic software factory: GitHub issues in, merged pull requests out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.scripts]
puxirum = "puxirum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puxirum = ["roles/*.md", "roles/lenses/*.md", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tables of cases read better on one line

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
